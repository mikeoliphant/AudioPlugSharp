<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <!-- A slider thumb's soft shadow, under its body and a little below it (as the knob's). -->
  <defs>
    <radialGradient id="shadow" cx="10" cy="11" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="10" cy="11" r="9" fill="url(#shadow)"/>
</svg>
