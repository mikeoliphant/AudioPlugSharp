<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <!-- A soft light on the top of a slider thumb (as the knob's), translucent. -->
  <defs>
    <linearGradient id="light" x1="0" y1="2" x2="0" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="10" cy="10" r="8" fill="url(#light)"/>
</svg>
