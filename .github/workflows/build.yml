name: Build

on:
  [workflow_dispatch, push, pull_request]

# Interim (cross-platform branch): builds the managed projects. The native CLAP/VST3 adapters, the
# Windows/Linux matrix, tests and packaging come with the AudioPlugSharpBridge move.
jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build
      working-directory: ${{github.workspace}}
      run: dotnet build AudioPlugSharp.sln -c Release
